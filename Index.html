<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotbeds | Coming Soon</title>
    <!-- Integrates MINI LOGO.png as the browser tab icon -->
    <link rel="icon" type="image/png" href="MINI%20LOGO.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Integrates COVER.png as a premium full-screen background */
            background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('COVER.png') no-repeat center center/cover;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 90%;
            backdrop-filter: blur(5px);
        }

        .logo {
            max-width: 220px;
            height: auto;
            margin-bottom: 25px;
        }

        h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tagline {
            color: #e52d27;
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        p {
            color: #666;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .timer-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
        }

        .time-box {
            background: #333;
            color: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            min-width: 80px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .time-box span {
            display: block;
            font-size: 2rem;
            font-weight: bold;
        }

        .time-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #ccc;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        .subscribe-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="email"] {
            padding: 15px;
            border: 2px solid #eee;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        input[type="email"]:focus {
            outline: none;
            border-color: #e52d27;
        }

        button {
            background-color: #e52d27;
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #c9221d;
        }

        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            .timer-container { gap: 10px; }
            .time-box { min-width: 65px; padding: 10px; }
            .time-box span { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Integrates LOGO.png -->
        <img src="LOGO.png" alt="Hotbeds Logo" class="logo">
        
        <h1>Coming Soon</h1>
        <div class="tagline">HOT DEALS. COOL STAYS.</div>
        
        <p>We are building the ultimate platform for securing last-minute rooms. Get ready to beat the timer and lock in unbeatable value on Canadian stays.</p>

        <div class="timer-container">
            <div class="time-box">
                <span id="days">00</span>
                <div class="time-label">Days</div>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <div class="time-label">Hours</div>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <div class="time-label">Minutes</div>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <div class="time-label">Seconds</div>
            </div>
        </div>

        <form class="subscribe-form" action="#" method="POST" onsubmit="event.preventDefault(); alert('Thanks for subscribing! We will notify you when we drop.');">
            <input type="email" placeholder="Enter your email for early access..." required>
            <button type="submit">Notify Me</button>
        </form>
    </div>

    <script>
        const launchDate = new Date();
        launchDate.setDate(launchDate.getDate() + 30);

        function updateTimer() {
            const now = new Date().getTime();
            const distance = launchDate - now;

            if (distance < 0) {
                clearInterval(interval);
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;
        }

        const interval = setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
