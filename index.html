<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotbeds - Win a Free Hotel Stay!</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
        }

        /* Background setup using your COVER.png */
        .bg-image {
            background-image: url('COVER.png');
            background-size: cover;
            background-position: center;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Dark overlay to make the white box pop */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.7); 
        }

        /* The Main White Box */
        .modal {
            position: relative;
            background-color: #ffffff; /* Changed to pure white to seamlessly blend with your logo */
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 450px;
            width: 90%;
            z-index: 10;
        }

        .logo {
            max-width: 180px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 26px;
            color: #222;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-weight: 800;
        }

        .subtitle {
            color: #e63946; /* Hotbeds Red */
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        p {
            font-size: 15px;
            color: #555;
            line-height: 1.5;
            margin-bottom: 25px;
            padding: 0 10px;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 15px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #f9f9f9;
            transition: border-color 0.3s;
        }
        
        input:focus {
            border-color: #e63946;
            outline: none;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #e63946; /* Hotbeds Red */
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
            text-transform: uppercase;
        }

        button:hover {
            background-color: #d62828;
        }
    </style>
</head>
<body>

    <div class="bg-image">
        <div class="overlay"></div>
        
        <div class="modal">
            <!-- Referencing your existing logo file -->
            <img src="LOGO.png" alt="Hotbeds.ca" class="logo">
            
            <h1>Win a Free Stay!</h1>
            <div class="subtitle">HOT DEALS. COOL STAYS.</div>
            
            <p>Enter to win a free hotel room in any Canadian city! We guarantee the lowest prices on the busiest nights of the year.</p>
            
            <form action="#" method="POST">
                <div class="form-group">
                    <input type="text" name="name" placeholder="Full Name" required>
                </div>
                <div class="form-group">
                    <input type="email" name="email" placeholder="Email Address" required>
                </div>
                <div class="form-group">
                    <input type="tel" name="phone" placeholder="Phone Number" required>
                </div>
                <div class="form-group">
                    <input type="text" name="address" placeholder="City & Province" required>
                </div>
                <button type="submit">Enter Contest</button>
            </form>
        </div>
        
    </div>

</body>
</html>
